<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h3>Giriş Yap</h3>
                </div>
                <div class="card-body">
                    <!-- Hata mesajı gösterimi -->
                    <div id="error-message" class="alert alert-danger d-none"></div>

                    <!-- Login Formu -->
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="username" class="form-label">Kullanıcı Adı</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Şifre</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Giriş Yap</button>
                    </form>

                    <hr>
                    <p class="text-center">Hesabınız yok mu? <a th:href="@{/auth/register}">Kayıt Ol</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.getElementById("loginForm").addEventListener("submit", async function(event) {
        event.preventDefault(); // Formun normal submit işlemini durdur

        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const errorMessage = document.getElementById("error-message");
        console.log("Giriş Yap Butonuna Basıldı!"); // Debug için log ekle

        try {
            const response = await fetch("/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });
            console.log("Sunucudan Cevap Geldi, HTTP Status:", response.status); // HTTP kodunu logla

            if (!response.ok) {
                throw new Error("Geçersiz kullanıcı adı veya şifre!");
            }
            const data = await response.json();
            console.log("Alınan Token:", data.token); // Token bilgisini konsolda göster
            localStorage.setItem("jwt_token", data.token); // Token'i kaydet
            window.location.href = "/workorders/list"; // Başarılı giriş sonrası yönlendirme

        } catch (error) {
            errorMessage.textContent = error.message;
            errorMessage.classList.remove("d-none");
        }
    });
</script>
</body>
</html>
